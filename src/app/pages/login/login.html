<div class="login-container">
  <div class="login-box">
    <div class="logo-area">
        <p class="brand">Docify</p>
    </div>
    <p class="subtitle">Sign in to your account</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter your password" />
    </div>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="button" (click)="login()">Login</button>


    <p class="register-link">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
