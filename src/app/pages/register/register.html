<div class="register-container">
  <div class="register-box">
    <div class="logo-area">
      <p class="brand">Docify</p>
    </div>
    <p class="subtitle">Create your account</p>

    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="name" placeholder="Enter your name" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input 
        type="email" [(ngModel)]="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter your password" />
    </div>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success" *ngIf="successMessage">{{ successMessage }}</div>

    <button type="button" (click)="register()">Register</button>

    <p class="login-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
